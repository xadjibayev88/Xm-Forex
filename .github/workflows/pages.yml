name: Saytni joylash (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Havolalarni qo'yish
        env:
          AFFILIATE_LINK: ${{ vars.AFFILIATE_LINK }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
        run: python3 scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
